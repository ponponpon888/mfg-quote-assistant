doc_id: SPEC-SF-2040
doc_type: part_spec
title: 部品仕様書 シャフト SF-2040
issued_on: 2025-09-22
revision: Rev.2
part:
  drawing_no: SF-2040
  name: シャフト
  material: S45C
  surface_treatment: 硬質クロムメッキ
  dimensions: φ20 x L240 mm
  tolerance: φ20 h7 (0 / -0.021)
  process_category: 切削
  min_lot: 10
  standard_lead_time_days: 18
sections:
  - heading: 1. 適用範囲
    body: |
      本仕様書は、図番 SF-2040（品名：シャフト）の製作および検査に適用する。
      回転部に組み込まれる部品であり、曲がり・振れの管理を特に重視する。
  - heading: 2. 材質および素材
    body: |
      材質： S45C（機械構造用炭素鋼）
      素材径： φ22 丸棒（黒皮）からの削り出しとする。
      材料証明書（ミルシート）の提出を要する。
  - heading: 3. 外形寸法および公差
    body: |
      外径： φ20 h7（0 / -0.021 mm）
      全長： L240 mm ±0.1 mm
      振れ（全長）： 0.02 mm 以下
      面取り： C1.0（両端）
  - heading: 4. 加工工程
    body: |
      (1) 旋盤加工（荒削り）
      (2) 熱処理 高周波焼入れ HRC 50 - 55
      (3) 円筒研磨（仕上げ）
      (4) 両端センター穴加工 A 形
  - heading: 5. 表面処理
    body: |
      表面処理： 硬質クロムメッキ
      膜厚： 20 µm 以上
      外観： 剥離・膨れ・焼けのないこと。
      メッキ後の外径が公差内に収まるよう、研磨代を考慮すること。
  - heading: 6. 検査
    body: |
      全数検査項目： 外径（マイクロメータ）、全長
      抜取検査項目： 振れ、硬度、メッキ膜厚（ロットあたり 3 個）
      検査成績表を納品時に添付する。
  - heading: 7. 包装および納入
    body: |
      1 本ごとに防錆紙で巻き、1 箱あたり 10 本を上限とする。
      標準納期： 受注後 18 営業日（熱処理およびメッキの外注工程を含む）
      最小ロット： 10 本
