doc_id: SPEC-BS-4070
doc_type: part_spec
title: 部品仕様書 ブッシュ BS-4070
issued_on: 2025-10-08
revision: Rev.1
part:
  drawing_no: BS-4070
  name: ブッシュ
  material: C3604
  surface_treatment: 無処理
  dimensions: φ40 x L70 mm
  tolerance: φ40 h7 (0 / -0.025)
  process_category: 切削
  min_lot: 10
  standard_lead_time_days: 18
sections:
  - heading: 1. 適用範囲
    body: |
      本仕様書は、図番 BS-4070（品名：ブッシュ）の製作および検査に適用する。
      軸受部に組み込まれる部品であり、内径の寸法管理を特に重視する。
  - heading: 2. 材質および素材
    body: |
      材質： C3604（快削黄銅）
      素材径： φ42 丸棒からの削り出しとする。
      材料証明書（ミルシート）の提出を要する。
  - heading: 3. 外形寸法および公差
    body: |
      外径： φ40 h7（0 / -0.025 mm）
      内径： φ25 H7（+0.021 / 0 mm）
      全長： L70 mm ±0.1 mm
      面取り： C0.5（両端）
  - heading: 4. 加工工程
    body: |
      (1) 旋盤加工（外径・内径）
      (2) 内径仕上げ（リーマ通し）
      (3) 端面加工
      (4) バリ取り（内外周）
  - heading: 5. 表面処理
    body: |
      表面処理： 無処理（黄銅素地のまま）
      油分・切粉を除去し、防錆油を薄く塗布して納入すること。
  - heading: 6. 検査
    body: |
      全数検査項目： 外径、内径（栓ゲージ）
      抜取検査項目： 全長、面取り（ロットあたり 3 個）
      検査成績表を納品時に添付する。
  - heading: 7. 包装および納入
    body: |
      内径に保護キャップを挿し、1 箱あたり 50 個を上限とする。
      標準納期： 受注後 18 営業日
      最小ロット： 10 個
