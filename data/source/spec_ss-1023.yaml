doc_id: SPEC-SS-1023
doc_type: part_spec
title: 部品仕様書 ブラケット SS-1023
issued_on: 2025-11-10
revision: Rev.3
part:
  drawing_no: SS-1023
  name: ブラケット
  material: SPCC t3.2
  surface_treatment: ユニクロメッキ
  dimensions: 120 x 80 x t3.2 mm
  tolerance: ±0.2 mm
  process_category: 板金
  min_lot: 20
  standard_lead_time_days: 14
sections:
  - heading: 1. 適用範囲
    body: |
      本仕様書は、図番 SS-1023（品名：ブラケット）の製作および検査に適用する。
      発注者と受注者の間で別途取り決めがある場合は、その取り決めを優先する。
  - heading: 2. 材質および板厚
    body: |
      材質： SPCC（冷間圧延鋼板）
      板厚： t3.2 mm
      材料証明書（ミルシート）の提出を要する。
      代替材を使用する場合は、事前に発注者の書面承認を得ること。
  - heading: 3. 外形寸法および公差
    body: |
      外形寸法： 120 x 80 x t3.2 mm
      一般公差： ±0.2 mm
      曲げ角度公差： ±1 度
      取付穴ピッチ公差： ±0.15 mm
  - heading: 4. 加工工程
    body: |
      (1) レーザー切断
      (2) 曲げ 2 箇所（曲げ R2.0、内側曲げ半径はダイに準ずる）
      (3) タップ加工 M5 x 4 箇所（深さ 6 mm 以上）
      (4) バリ取り（全周、手触りでバリを感じないこと）
  - heading: 5. 表面処理
    body: |
      表面処理： ユニクロメッキ（電気亜鉛めっき クロメート処理）
      膜厚： 5 μm 以上
      外観： 変色・めっきムラ・ピンホールのないこと。
      タップ部はめっき後にネジゲージが通ること。
  - heading: 6. 検査
    body: |
      全数検査項目： 外観、タップ通りゲージ
      抜取検査項目： 外形寸法、曲げ角度、めっき膜厚（ロットあたり 3 個）
      検査成績表を納品時に添付する。
  - heading: 7. 包装および納入
    body: |
      1 箱あたり 25 個を上限とし、個々に緩衝材を挟む。
      標準納期： 受注後 14 営業日
      最小ロット： 20 個
