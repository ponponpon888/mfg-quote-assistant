doc_id: RULE-001
doc_type: internal_rule
title: 社内見積基準 RULE-001
issued_on: 2026-07-01
revision: Rev.5
rules:
  quote_validity_days: 30
  min_order_amount: 30000
  volume_discounts:
    - min_quantity: 100
      rate: 0.03
    - min_quantity: 300
      rate: 0.07
    - min_quantity: 1000
      rate: 0.12
  rush_surcharges:
    - max_lead_time_days: 5
      rate: 0.50
    - max_lead_time_days: 7
      rate: 0.35
    - max_lead_time_days: 10
      rate: 0.20
  min_lots:
    板金: 20
    切削: 10
  standard_lead_time_days:
    板金: 14
    切削: 18
  material_revision:
    effective_from: 2026-07-01
    increases:
      鋼材: 0.08
      ステンレス: 0.12
sections:
  - heading: 1. 目的
    body: |
      本基準は、株式会社サンプル精機（架空）における見積作成の社内ルールを定める。
      担当者による単価のばらつきを抑え、見積の根拠を後から追跡できる状態にすることを目的とする。
  - heading: 2. 見積有効期限
    body: |
      見積の有効期限は、発行日から 30 日とする。
      有効期限を過ぎた見積を再提出する場合は、材料費の改定有無を必ず確認する。
  - heading: 3. 最低受注金額
    body: |
      1 件あたりの最低受注金額は 30,000 円とする。
      これを下回る場合は、段取り費として差額を計上するか、受注を見送る。
  - heading: 4. 数量値引基準
    body: |
      数量に応じて以下の値引率を単価に適用する。区分は重複適用しない。
      100 個以上： 3%
      300 個以上： 7%
      1,000 個以上： 12%
      これを超える値引きを行う場合は、工場長の承認を得ること。
  - heading: 5. 短納期割増率
    body: |
      標準納期より短い納期を要求された場合、以下の割増率を単価に適用する。
      10 営業日以内： 20%
      7 営業日以内： 35%
      5 営業日以内： 50%
      割増は数量値引の適用後の単価に対して計算する。
  - heading: 6. 最小ロット
    body: |
      板金部品： 20 個
      切削部品： 10 個
      最小ロットを下回る数量の引合いについては、最小ロット数量での見積を提示する。
  - heading: 7. 標準納期
    body: |
      板金部品： 受注後 14 営業日
      切削部品： 受注後 18 営業日
      外注工程（熱処理・めっき）を含む場合は、上記に 3 営業日を加算して回答する。
  - heading: 8. 材料費の改定
    body: |
      材料費改定日： 2026-07-01
      鋼材（SPCC、S45C 等）： 8% 引き上げ
      ステンレス（SUS304 等）： 12% 引き上げ
      改定日より前に発行した見積を参照して新規見積を作成する場合は、
      上記の引き上げ率を反映しているか必ず確認する。
  - heading: 9. 見積根拠の記録
    body: |
      見積を提出する際は、参照した過去見積の見積番号と、適用した値引・割増の区分を
      見積控えに記録する。記録のない見積は提出しない。
