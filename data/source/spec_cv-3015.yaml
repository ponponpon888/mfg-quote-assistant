doc_id: SPEC-CV-3015
doc_type: part_spec
title: 部品仕様書 カバー CV-3015
issued_on: 2026-02-03
revision: Rev.1
part:
  drawing_no: CV-3015
  name: カバー
  material: SUS304 t1.5
  surface_treatment: "バフ研磨 #400"
  dimensions: 300 x 150 x t1.5 mm
  tolerance: ±0.3 mm
  process_category: 板金
  min_lot: 20
  standard_lead_time_days: 14
sections:
  - heading: 1. 適用範囲
    body: |
      本仕様書は、図番 CV-3015（品名：カバー）の製作および検査に適用する。
      本図番は新規図番であり、量産実績および過去見積はまだ無い。
  - heading: 2. 材質および板厚
    body: |
      材質： SUS304（オーステナイト系ステンレス鋼）
      板厚： t1.5 mm
      材料証明書（ミルシート）の提出を要する。
  - heading: 3. 外形寸法および公差
    body: |
      外形寸法： 300 x 150 x t1.5 mm
      一般公差： ±0.3 mm
      曲げ角度公差： ±1 度
  - heading: 4. 加工工程
    body: |
      (1) レーザー切断
      (2) 曲げ 4 箇所
      (3) スポット溶接 6 点（溶接後の歪みを矯正すること）
      (4) バリ取り（全周）
  - heading: 5. 表面処理
    body: |
      表面処理： バフ研磨 #400（めっき処理なし）
      溶接部の焼けは酸洗いまたは研磨により除去すること。
      外観面（意匠面）に打痕・スクラッチを付けないこと。
  - heading: 6. 検査
    body: |
      全数検査項目： 外観（意匠面）、溶接点数
      抜取検査項目： 外形寸法、曲げ角度（ロットあたり 3 個）
      検査成績表を納品時に添付する。
  - heading: 7. 包装および納入
    body: |
      意匠面に保護フィルムを貼り、1 箱あたり 10 個を上限とする。
      標準納期： 受注後 14 営業日
      最小ロット： 20 個
