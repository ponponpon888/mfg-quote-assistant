doc_id: SPEC-PL-1150
doc_type: part_spec
title: 部品仕様書 取付プレート PL-1150
issued_on: 2026-01-20
revision: Rev.1
part:
  drawing_no: PL-1150
  name: 取付プレート
  material: SPCC t1.6
  surface_treatment: ユニクロメッキ
  dimensions: 260 x 160 x t1.6 mm
  tolerance: ±0.3 mm
  process_category: 板金
  min_lot: 20
  standard_lead_time_days: 14
sections:
  - heading: 1. 適用範囲
    body: |
      本仕様書は、図番 PL-1150（品名：取付プレート）の製作および検査に適用する。
      筐体内部に取り付ける部品であり、外観面としての扱いはしない。
  - heading: 2. 材質および板厚
    body: |
      材質： SPCC（冷間圧延鋼板）
      板厚： t1.6 mm
      材料証明書（ミルシート）の提出を要する。
  - heading: 3. 外形寸法および公差
    body: |
      外形寸法： 260 x 160 x t1.6 mm
      一般公差： ±0.3 mm
      取付穴ピッチ公差： ±0.2 mm
  - heading: 4. 加工工程
    body: |
      (1) レーザー切断
      (2) 曲げ 2 箇所
      (3) タップ加工 M4 x 6 箇所（深さ 5 mm 以上）
      (4) バリ取り（全周）
  - heading: 5. 表面処理
    body: |
      表面処理： ユニクロメッキ（電気亜鉛めっき クロメート処理）
      膜厚： 5 μm 以上
      外観： 変色・めっきムラのないこと。
  - heading: 6. 検査
    body: |
      全数検査項目： 外観、タップ通りゲージ
      抜取検査項目： 外形寸法、取付穴ピッチ（ロットあたり 3 個）
      検査成績表を納品時に添付する。
  - heading: 7. 包装および納入
    body: |
      1 箱あたり 40 個を上限とし、積み重ね時に緩衝材を挟む。
      標準納期： 受注後 14 営業日
      最小ロット： 20 個
