name: CI

on:
  push:
    branches: [main]
  pull_request:

# 実 API は呼ばない。LLM_PROVIDER を明示して mock に固定する。
env:
  LLM_PROVIDER: mock

jobs:
  ingest:
    name: ingest (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/pyproject.toml

      - name: Install
        working-directory: ingest
        run: pip install -e ".[dev]"

      # コミット済みの web/public/*.json が data/source と一致するかも
      # pytest 側で見ている（tests/test_committed_index.py）。
      - name: pytest
        working-directory: ingest
        run: python -m pytest

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: lint
        working-directory: web
        run: npm run lint

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: test
        working-directory: web
        run: npm test

      - name: build
        working-directory: web
        run: npm run build
